name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify version consistency
        run: |
          python - <<'PY'
          import re
          import tomllib
          from pathlib import Path

          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project_version = pyproject["project"]["version"]

          init_text = Path("src/mai/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\\s*=\\s*["\\\']([^"\\\']+)["\\\']', init_text)
          if not match:
              raise SystemExit("Could not find __version__ in src/mai/__init__.py")
          init_version = match.group(1)

          if project_version != init_version:
              raise SystemExit(
                  f"Version mismatch: pyproject.toml={project_version} vs src/mai/__init__.py={init_version}"
              )
          print("Version OK:", project_version)
          PY

      - name: Pytest
        env:
          MAI_DISABLE_WATCHER: "1"
        run: pytest -q
